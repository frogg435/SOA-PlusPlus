plugins {
        id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group

base {
        archivesName = project.archives_base_name
}

repositories {
        // Loom 自带的 Fabric / Mojang 仓库之外，仅 ModMenu / Cloth Config 的官方 maven
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        // ModMenu / Cloth Config：仅编译期依赖，运行时可选（装了才有 GUI，没装不影响功能）
        modCompileOnly "com.terraformersmc:modmenu:7.2.2"
        modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:11.1.136"
}

processResources {
        inputs.property "version", project.version

        filesMatching("fabric.mod.json") {
                expand "version": project.version
        }
}

tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 17
}

java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
}

jar {
        from("LICENSE") {
                rename { "${it}_${project.base.archivesName.get()}" }
        }
}
